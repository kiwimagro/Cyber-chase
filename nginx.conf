# Configuração do nginx para o Cyber Chase.
# Montada em /etc/nginx/conf.d/default.conf dentro do container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Página 404 amigável (mantém o status 404 via redirecionamento interno)
    error_page 404 /404.html;

    # Compressão gzip para reduzir o tempo de carregamento
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HTML e JSON devem sempre revalidar (o JSON é o conteúdo dos cursos)
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Arquivos estáticos (imagens, ícones, fontes): cache longo
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Como o volume monta o repositório inteiro, bloqueia o acesso
    # aos arquivos de infraestrutura que não fazem parte do site.
    location ~ ^/(SPEC|requirements)\.md$ { deny all; }
    location = /nginx.conf { deny all; }
    location = /docker-compose.yml { deny all; }
    location = /README.md { deny all; }
}
