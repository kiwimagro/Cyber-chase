    <linearGradient id="gradEscudo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c3bcb"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <path d="M32 3 L56 12 V30 C56 45 45 56 32 61 C19 56 8 45 8 30 V12 Z"
        fill="url(#gradEscudo)"/>
  <!-- Corpo do cadeado (branco) -->
