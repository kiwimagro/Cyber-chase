# Orquestração do site Cyber Chase (site estático servido pelo nginx).
# Uso: docker compose up -d  →  http://localhost:8080
services:
  cyber-chase:
    image: nginx:1.27-alpine
    container_name: cyber-chase
    ports:
      # Porta do host configurável via variável de ambiente (ex.: CYBER_CHASE_PORT=9090)
      - "${CYBER_CHASE_PORT:-8080}:80"
    volumes:
      # O repositório inteiro é montado somente-leitura dentro do nginx,
      # então qualquer edição nos arquivos aparece na hora (sem rebuild).
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      # Verifica se o nginx está respondendo (usa o wget do busybox).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
